# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render's Blueprint schema has changed over time (e.g. `env: docker` vs.
# `runtime: docker` in older/newer docs); if importing this file fails,
# create the web service and database manually with the same settings —
# see DEPLOY.md, which documents both paths and is the source of truth.
databases:
  - name: cloudpilot-db
    plan: free
    databaseName: cloudpilot
    user: cloudpilot

services:
  - type: web
    name: cloudpilot-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudpilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard — never commit this
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: USD_TO_INR_RATE
        value: "83.0"
      - key: ALLOWED_ORIGINS
        value: "" # set to your Vercel production URL after the frontend deploys, then redeploy
      - key: APP_ENV
        value: production
