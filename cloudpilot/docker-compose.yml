services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudpilot
      POSTGRES_PASSWORD: cloudpilot
      POSTGRES_DB: cloudpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://cloudpilot:cloudpilot@postgres:5432/cloudpilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
